<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도시 날씨</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>도시 날씨</h1>
  <form id="search-form">
    <input id="city" type="text" placeholder="도시 이름 (예: 서울, Tokyo, Paris)" autocomplete="off" required>
    <button type="submit">검색</button>
  </form>
  <div id="status" role="status"></div>
  <section id="result" hidden>
    <h2 id="place"></h2>
    <div class="main">
      <span id="icon"></span>
      <span id="temp"></span>
    </div>
    <p id="desc"></p>
    <ul>
      <li>체감 온도 <b id="feels"></b></li>
      <li>습도 <b id="humidity"></b></li>
      <li>풍속 <b id="wind"></b></li>
      <li>강수량 <b id="precip"></b></li>
    </ul>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
